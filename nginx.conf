# SyncQuote Front 정적 서빙 (SPA)
# /api/v1 는 K8s Ingress가 api-service로 라우팅하므로 여기서 프록시하지 않는다.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 해시 파일명 정적 자산은 장기 캐시
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # 루트(/)만 앱 진입점. 그 외 경로는 실제 파일이 있을 때만 서빙하고 없으면 404.
  # (vue-router 미사용 → SPA 폴백을 두지 않아 "없는 경로 = 홈"으로 새지 않게 함)
  # ↳ 추후 vue-router 도입 시: 아래 두 location을 `try_files $uri /index.html;` 로 되돌리고
  #    앱 내부 NotFound 라우트로 처리할 것.
  location = / {
    try_files /index.html =404;
  }
  location / {
    try_files $uri =404;
  }

  # 정의되지 않은 경로 → 브랜디드 404 페이지 (상태코드는 404 유지)
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
