# SyncQuote Front 정적 서빙 (SPA)
# /api/v1 는 K8s Ingress가 api-service로 라우팅하므로 여기서 프록시하지 않는다.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: 새로고침/딥링크 시 index.html 로 폴백 (404 방지)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 해시 파일명 정적 자산은 장기 캐시
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
