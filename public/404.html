<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>페이지를 찾을 수 없습니다 · SyncQuote</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e8ecf2;
        color: #222831;
        font-family: Arial, 'Noto Sans KR', sans-serif;
      }
      .card {
        max-width: 420px;
        margin: 16px;
        padding: 40px 32px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #d8dde6;
        border-radius: 12px;
      }
      .code {
        font-size: 64px;
        font-weight: 800;
        line-height: 1;
        color: #115dcb;
        letter-spacing: -1px;
      }
      h1 { margin: 16px 0 8px; font-size: 20px; }
      p { margin: 0 0 24px; color: #68717f; font-size: 14px; line-height: 1.6; }
      .home {
        display: inline-block;
        padding: 10px 20px;
        background: #115dcb;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        border-radius: 8px;
      }
      .home:hover { background: #0d4ba6; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404</div>
      <h1>페이지를 찾을 수 없습니다</h1>
      <p>요청하신 주소가 존재하지 않거나 이동되었습니다.<br />아래 버튼으로 대시보드로 돌아가세요.</p>
      <a class="home" href="/">SyncQuote 홈으로</a>
    </main>
  </body>
</html>
