name: Deploy SyncQuote Front Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write              # GHCR 푸시용

concurrency:
  group: syncquote-front-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: syncquote-front
  K8S_NAMESPACE: default
  K8S_DEPLOYMENT: front-server
  K8S_CONTAINER: front

jobs:
  build-check:
    name: Build Front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build        # vite 빌드 실패를 푸시 전에 잡는다

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: build-check
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags
        id: image
        run: |
          IMAGE="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          IMAGE="${IMAGE,,}"        # GHCR은 소유자명 소문자 요구
          echo "image=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_SHA=${IMAGE}:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${IMAGE}:latest" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_SHA }}
            ${{ env.IMAGE_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    # self-hosted runner + 클러스터가 준비됐을 때만 실행 (repo 변수 DEPLOY_ENABLED=true).
    # 미설정이면 skipped → 빌드/푸시까지만 완료되어 무기한 Pending·실패 Deployment 방지.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, x64]
    needs: build-and-push
    environment: production
    steps:
      - name: Check Kubernetes access
        run: |
          command -v kubectl
          kubectl config current-context
          kubectl -n "$K8S_NAMESPACE" get deployment/"$K8S_DEPLOYMENT"
      - name: Update front deployment image
        run: |
          kubectl -n "$K8S_NAMESPACE" set image \
            deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER"="${{ needs.build-and-push.outputs.image }}"
      - name: Wait for rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status \
            deployment/"$K8S_DEPLOYMENT" --timeout=120s
